<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="CWA Help Desk Appointment Form">
    <meta name="keywords" content="Help Desk, COS10026, HTML Form, Swinburne, Cats">
    <meta name="author" content="Thai Bao Nguyen">

    <title>CWA Help Desk Appointment</title>
</head>

<body>

    <a href="https://www.swinburne.edu.au/preference-swinburne/?siid=bnr_hpb%7Ccamp_tim%7Csrcnam_hp%7Csrcloc_hero%7C502"
        target="_blank">
        <img src="swin_logo.png" alt="Swinburne Logo" title="Swinburne University of Technology Logo">
    </a>

    <h1>CWA Help Desk Appointment</h1>

    <p>
        The Help Desk is located in ATC620.
        Open 10:30 to 19:00 Monday to Friday.
    </p>

    <p>
        Check Blackboard for when CWA tutors will be there.
    </p>

    <form method="post"
        action="http://mercury.swin.edu.au/it000000/formtest.php">

        <fieldset>
            <legend>Student Details</legend>     
                <label for="studentid">Student ID</label>
                <input 
                type="text"
                id="studentid"
                name="studentid"
                pattern="\d{7,10}"
                required>
            <br><br>

           
                <label for="givenname">Given Name</label>
                <input 
                type="text"
                id="givenname"
                name="givenname"
                maxlength="15"
                pattern="[A-Za-z]+"
                required>

                <label for="familyname">Family Name</label>
                <input 
                type="text"
                id="familyname"
                name="familyname"
                maxlength="15"
                pattern="[A-Za-z]+"
                required>
            </p>

        </fieldset>

        <fieldset>
            <legend>Your Unit</legend>

            <input 
                type="radio"
                id="cos10011"
                name="unit"
                value="COS10011"
                required="required">

            <label for="cos10011">COS10011</label>

            <input 
                type="radio"
                id="cos60004"
                name="unit"
                value="COS60004">

            <label for="cos60004">COS60004</label>

            <input 
                type="radio"
                id="cos60007"
                name="unit"
                value="COS60007">

            <label for="cos60007">COS60007</label>

            <br><br>

            <label for="tutor">Your Tutor</label>

            <select id="tutor"
                name="tutor"
                required="required">

                <option value="">Please Select</option>
                <option value="John Smith">John Smith</option>
                <option value="Sarah Lee">Sarah Lee</option>
                <option value="David Brown">David Brown</option>
                <option value="Emma Wilson">Emma Wilson</option>

            </select>

        </fieldset>

        <fieldset>
            <legend>Issue</legend>

            <input 
                type="checkbox"
                id="html"
                name="issue"
                value="HTML"
                checked="checked">

            <label for="html">HTML</label>

            <input 
                type="checkbox"
                id="css"
                name="issue"
                value="CSS">

            <label for="css">CSS</label>

            <input 
                type="checkbox"
                id="javascript"
                name="issue"
                value="JavaScript">

            <label for="javascript">JavaScript</label>

            <input 
                type="checkbox"
                id="php"
                name="issue"
                value="PHP">

            <label for="php">PHP</label>

            <input 
                type="checkbox"
                id="mysql"
                name="issue"
                value="MySQL">

            <label for="mysql">MySQL</label>

            <br><br>

            <label for="description">Description of Issue</label>
            <br>

            <textarea id="description"
                name="description"
                rows="6"
                cols="40"
                placeholder="Write description of your problem here..."
                required></textarea>

        </fieldset>

        <fieldset>
            <legend>Preferred Date / Time</legend>

            <p>
                <label for="date">Date</label>

                <input 
                    type="text"
                    id="date"
                    name="date"
                    placeholder="dd/mm/yyyy"
                    pattern="\d{2}/\d{2}/\d{4}"
                    required>
            </p>

            <p>
                <label for="time">Time</label>

                <input 
                    type="text"
                    id="time"
                    name="time"
                    placeholder="00:00"
                    pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]"
                    required>
            </p>

        </fieldset>

        <p>
            <input type="submit" value="Book">
            <input type="reset" value="Reset Form">
        </p>

    </form>

</body>

</html>
